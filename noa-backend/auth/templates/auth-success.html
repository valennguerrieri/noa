<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Autenticación exitosa</title>

    <style>
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            font-family: 'Segoe UI'; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 400px;
        }

        h1{ 
            color: #4caf50; 
            font-size: 24px; 
            margin-bottom: 10px;
        }

        p{ 
            color: #b0b0b0; 
            font-size: 16px; 
            line-height: 1.5; 
        }

        .icon{ 
            font-size: 50px; 
            margin-bottom: 20px; 
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>{{MESSAGE}}</h1>
        <p>Has iniciado sesión correctamente en NOA.</p>
        <p>Ya puedes cerrar esta pestaña y volver a la aplicación.</p>
    </div>
</body>
    
</html>
