<div class="form-container" (click)="$event.stopPropagation()">
    <h1 class="titulo">NUEVA NOTA</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="form-grid">
            <div class="form-etiqueta">
                <div class="form-tit">
                    <img src="assets/agenda.png" alt="ag">
                    <label for="fecha">Fecha</label>
                </div>
            
                <div class="form-input">
                    <input type="text" id="fecha" formControlName="fecha" readonly> 
                </div>

            </div> 


            <div class="form-etiqueta">
                <div class="form-tit">
                    <img src="assets/titulo.png" alt="tit">
                    <label for="titulo">Título</label>
                </div>

                <div class="form-input">
                    <input type="text" id="titulo" formControlName="titulo"> 
                </div>

                <div class="form-error">
                    @if(form.controls['titulo'].getError('required') && form.controls['titulo'].touched){
                        <span>Debe ingresar el título de la nota.</span>
                    }
                </div>

            </div> 


            <div class="form-etiqueta">
                <div class="form-tit">
                    <img src="assets/descrip.png" alt="des">
                    <label for="descripcion">Descripción</label>
                </div>
                
                <div class="form-input">
                    <textarea id="descripcion" formControlName="descripcion"></textarea>
                </div>

                <div class="form-error">
                    @if(form.controls['descripcion'].getError('required') && form.controls['descripcion'].touched){
                        <span>Debe ingresar la descripción de la nota.</span>
                    }
                </div>

            </div>

            <div class="form-etiqueta">
                <div class="form-tit">
                    <img src="assets/paleta.png" alt="pal">
                    <label for="color">Color</label>
                </div>
                
                <div class="color-selector">
                    <label class="color-option" *ngFor="let color of coloresPaleta" [style.backgroundColor]="color">
                        <input type="radio" formControlName="color" [value]="color">
                    </label>
                </div>

            </div>
        </div>

        <div class="form-buttons">
            <button type="submit"[disabled]="form.invalid" class="button-submit">Guardar</button>
            <button type="button" class="button-cancel" (click)="onCancelar()">Cancelar</button>
        </div>
        
        
    </form>

</div>
